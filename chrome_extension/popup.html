<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
    }
    h3 {
      margin-top: 0;
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .desc {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .btn {
      width: 100%;
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #0369a1;
    }
    .btn:disabled {
      background: #1e293b;
      color: #64748b;
      cursor: not-allowed;
    }
    #status {
      margin-top: 15px;
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      padding: 8px;
      border-radius: 6px;
      display: none;
    }
    .success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #34d399;
    }
    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #f87171;
    }
  </style>
</head>
<body>
  <h3>🏢 Takas Verisi Gönderici</h3>
  <div class="desc">
    Fintables Pro Takas Analizi sayfasındayken aşağıdaki butona tıklayarak bugünün verilerini yerel veritabanına kaydedebilirsiniz.
  </div>
  <button id="sendBtn" class="btn">Verileri Gönder ➔</button>
  <div style="margin-top: 12px; display: flex; align-items: center; gap: 8px;">
    <input type="checkbox" id="scrollChk" checked style="cursor: pointer;">
    <label for="scrollChk" style="font-size: 12px; color: #94a3b8; cursor: pointer; user-select: none;">Tüm Tabloyu Tara (Otomatik Kaydır)</label>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
